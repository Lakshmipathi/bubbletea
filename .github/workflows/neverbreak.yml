name: neverbreak
on:
  push:
  workflow_dispatch:

jobs:
  race-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race TestKillDuringStartupRace
        run: go test -race -count=3 -timeout=180s -run TestKillDuringStartupRace .
